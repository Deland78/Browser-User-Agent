line-length = 100

[lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
  "UP",
  "ASYNC",
  "S",
  "PLR",
  "PLE",
]
ignore = ["E501", "B008"]
preview = true

[lint.isort]
known-first-party = ["browser_agent"]

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR6301", "PLR2004"]  # Allow asserts, instance methods, and magic values in tests

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

